name: job-watch

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (~9 AM ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          JOB_WATCH_NOTIFY: "0"
          JOB_WATCH_WEBHOOK: ${{ secrets.JOB_WATCH_WEBHOOK }}
        run: python3 check_jobs.py --quiet

      - name: Commit state and digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json digest-*.md
          git diff --cached --quiet && exit 0
          git commit -m "job-watch digest $(date +%F)"
          git push
