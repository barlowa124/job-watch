name: job-watch

on:
  schedule:
    - cron: "0 14 * * 1"   # Mondays 14:00 UTC (~9 AM ET)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run watcher
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          JOB_WATCH_NOTIFY: "0"
          JOB_WATCH_WEBHOOK: ${{ secrets.JOB_WATCH_WEBHOOK }}
        run: python3 check_jobs.py --quiet
